services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-rubiks_cube}
      MYSQL_USER: ${DATABASE_USERNAME:-rubiks_cube}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - '127.0.0.1:${DATABASE_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
